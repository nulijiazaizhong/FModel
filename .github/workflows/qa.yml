name: FModel QA Builder

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Get Commit Info
        id: commit_info
        run: |
          echo "short_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1 | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9 ]//g' | sed 's/  */-/g' | head -c50)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --pretty=%ci | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: .NET 8 Setup
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: .NET Restore
        run: dotnet restore "./FModel/FModel.slnx" -r win-x64

      - name: .NET Publish
        run: dotnet publish "./FModel/FModel.csproj" -c Release --no-restore --no-self-contained -r win-x64 -f net8.0-windows -o "./FModel/bin/Publish/" -p:PublishReadyToRun=false -p:PublishSingleFile=true -p:DebugType=None -p:GenerateDocumentationFile=false -p:DebugSymbols=false

      - name: ZIP File
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: zip
          filename: FModel-${{ steps.commit_info.outputs.short_sha }}.zip
          path: ./FModel/bin/Publish/FModel.exe

      - name: Edit QA Artifact
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 'FModel QA ${{ steps.commit_info.outputs.short_sha }} - ${{ steps.commit_info.outputs.message }}'
          body: |
            ## Build Info
            - **Commit**: `${{ github.sha }}`
            - **Author**: ${{ steps.commit_info.outputs.author }}
            - **Date**: ${{ steps.commit_info.outputs.date }}
            - **Message**: ${{ github.event.head_commit.message }}

            ## Changes
            ```
            ${{ github.event.head_commit.message }}
            ```
          tag: 'v${{ steps.commit_info.outputs.short_sha }}'
          artifacts: FModel-${{ steps.commit_info.outputs.short_sha }}.zip
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true

